name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller vex.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vex-linux
          path: dist/Vex

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller vex.spec

      - name: Create DMG installer
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Vex" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Vex.app" 200 190 \
            --hide-extension "Vex.app" \
            --app-drop-link 600 185 \
            --no-internet-enable \
            "Vex.dmg" \
            "dist/Vex.app" || true

      # Optional Gatekeeper signing for GitHub downloads — not App Store.
      - name: Notarize and Staple (requires secrets)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ ! -f Vex.dmg ]; then echo "No DMG to notarize"; exit 0; fi
          xcrun notarytool submit "Vex.dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "Vex.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vex-macOS
          path: |
            Vex.dmg
            dist/Vex.app

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Vex.dmg
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
