name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run stub tests
        env:
          QT_QPA_PLATFORM: offscreen
          VEX_AGENT_BACKEND: stub
          VEX_SKIP_CORE_EXPORT: "1"
        run: pytest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/screenshots/*.png
          if-no-files-found: warn
